<dialog
  #dialog
  class="not-enough-popup"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="messageId"
  (click)="onDialogClick($event)"
  (close)="onNativeClose()"
>
  <div class="not-enough-popup__top">
    <button
      type="button"
      class="not-enough-popup__close"
      aria-label="Close"
      (click)="onCloseClick()"
    >
      <svg
        viewBox="0 0 13 13"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M1 1l11 11" />
        <path d="M12 1l-11 11" />
      </svg>
    </button>
  </div>

  <div class="not-enough-popup__body">
    <div class="not-enough-popup__headline">
      <h2 class="not-enough-popup__title" [id]="titleId">
        @if (title() === defaultTitle) {
          Ups!<br class="not-enough-popup__title-break" />
          Not quite enough...
        } @else {
          {{ title() }}
        }
      </h2>
      <p class="not-enough-popup__message" [id]="messageId">{{ message() }}</p>
    </div>

    <button type="button" class="btn btn--secondary btn--creme" (click)="onAction()">
      {{ actionLabel() }}
      <svg
        class="btn__icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M1 12h22" />
        <path d="M17 6l6 6-6 6" />
      </svg>
    </button>
  </div>
</dialog>
