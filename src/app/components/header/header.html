<header class="site-header" [class.site-header--spacious]="spacious()">
  <a routerLink="/" class="site-header__logo-link">
    <img
      [src]="logoSrc()"
      alt="Code à Cuisine – home"
      width="95"
      height="32"
      class="site-header__logo"
    />
  </a>

  @if (historyBack() && canGoBack) {
    <a href="/" (click)="goBack($event)" class="site-header__back">
      <ng-container [ngTemplateOutlet]="backContent" />
    </a>
  } @else if (backLink()) {
    <a [routerLink]="backLink()" [queryParams]="backQueryParams()" class="site-header__back">
      <ng-container [ngTemplateOutlet]="backContent" />
    </a>
  }

  <ng-template #backContent>
    <span class="site-header__back-icon">
      <!-- Figma "Arrow 11": 20px line, 2px stroke in user units 1:1; the round caps overflow by 1px. -->
      <svg
        width="20"
        height="20"
        viewBox="0 0 20 20"
        overflow="visible"
        fill="none"
        stroke="#1e5515"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M20 10H0" />
        <path d="M6 4L0 10L6 16" />
      </svg>
    </span>
    <span class="site-header__back-label">{{ backLabel() }}</span>
  </ng-template>
</header>
