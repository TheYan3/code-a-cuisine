<div class="ingredient-input">
  <form class="ingredient-input__row" (submit)="$event.preventDefault(); add.emit()">
    <div class="ingredient-input__field-col">
      <div class="ingredient-input__label-group">
        <label class="ingredient-input__label" for="ingredient-name">Ingredient</label>

        <div class="ingredient-input__field-box">
          <input
            #nameInput
            id="ingredient-name"
            type="text"
            class="ingredient-input__name-input"
            autocomplete="off"
            maxlength="40"
            required
            role="combobox"
            aria-autocomplete="list"
            [attr.aria-expanded]="autocompleteOpen()"
            [value]="ingredientValue()"
            (input)="ingredientValue.set($any($event.target).value)"
            (keydown)="nameKeydown.emit($event)"
          />
          @if (ghostText()) {
            <span class="ingredient-input__ghost" aria-hidden="true">
              <span class="ingredient-input__ghost-typed" [textContent]="ingredientValue()"></span>
              <span [textContent]="ghostText()"></span>
            </span>
          }
        </div>
      </div>

      @if (autocompleteOpen()) {
        <ul class="ingredient-input__dropdown" role="listbox">
          @for (suggestion of suggestions(); track suggestion) {
            <li
              class="ingredient-input__option"
              role="option"
              (click)="suggestionSelected.emit(suggestion)"
              (mouseenter)="suggestionHighlighted.emit(suggestion)"
              (mouseleave)="suggestionHighlightCleared.emit()"
            >
              {{ suggestion }}
            </li>
          }
        </ul>
      }
    </div>

    <div class="ingredient-input__serving-col">
      <label
        class="ingredient-input__label ingredient-input__label--serving"
        for="ingredient-amount"
        >Serving size</label
      >

      <div class="ingredient-input__serving-row">
        <div class="ingredient-input__amount-box">
          <input
            id="ingredient-amount"
            type="number"
            class="ingredient-input__amount-input"
            placeholder="100"
            required
            min="1"
            max="9999"
            step="1"
            [value]="amount()"
            (input)="amount.set($any($event.target).valueAsNumber || null)"
          />
        </div>

        <app-unit-select
          [unit]="unit()"
          [open]="unitOpen()"
          (toggle)="unitToggle.emit()"
          (select)="unit.set($event); unitToggle.emit()"
        />

        <button type="submit" class="ingredient-input__add" aria-label="Add ingredient"></button>
      </div>
    </div>
  </form>
</div>
