<div class="like">
  <p class="like__text">
    <strong>Just finished this meal?</strong>
    Give it a heart, so that the others know this is delicious.
  </p>

  <div class="like__control">
    <button
      type="button"
      class="like__heart"
      [class.like__heart--liked]="isLiked()"
      [attr.aria-pressed]="isLiked()"
      [attr.aria-label]="
        isLiked() ? 'Take back your like for this recipe' : 'Mark this recipe as cooked and liked'
      "
      (click)="toggled.emit()"
    ></button>
    <span class="like__count">{{ count() }}</span>
  </div>
</div>
