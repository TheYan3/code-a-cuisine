<div class="page">
  <app-header backLink="/generator" backLabel="Ingredients" />

  <main class="preferences">
    <h1 class="preferences__title">Choose your preferences</h1>

    <div class="preferences__body">
      <div class="preferences__counters">
        <div class="preferences__counter-group">
          <p class="preferences__counter-label">How many portions you need?</p>
          <app-counter [value]="2" [min]="1" [max]="12" unitLabel="Portions" />
        </div>
        <div class="preferences__counter-group">
          <p class="preferences__counter-label">How many are cooking?</p>
          <app-counter [value]="1" [min]="1" [max]="3" unitLabel="Person" />
        </div>
      </div>

      <div class="preferences__form">
        <fieldset class="preference-group">
          <legend class="preference-group__legend">
            <img src="/icons/clock.svg" alt="" width="24" height="24" />
            <span>Cooking time:</span>
          </legend>
          <div class="preference-group__tags">
            @for (option of cookingTimeOptions; track option.value) {
              <div class="preference-group__tag-with-sublabel">
                <app-tag name="cookingTime" [value]="option.value" [label]="option.label" />
                <span class="preference-group__sublabel">{{ option.sublabel }}</span>
              </div>
            }
          </div>
        </fieldset>

        <fieldset class="preference-group">
          <legend class="preference-group__legend">
            <img src="/icons/public.svg" alt="" width="24" height="24" />
            <span>Cuisine</span>
          </legend>
          <div class="preference-group__tags">
            @for (option of cuisineOptions; track option) {
              <app-tag name="cuisine" [value]="option" [label]="option" />
            }
          </div>
        </fieldset>

        <fieldset class="preference-group">
          <legend class="preference-group__legend">
            <img src="/icons/fork_spoon.svg" alt="" width="24" height="24" />
            <span>Diet preferences</span>
          </legend>
          <div class="preference-group__tags">
            @for (option of dietOptions; track option) {
              <app-tag name="diet" [value]="option" [label]="option" />
            }
          </div>
        </fieldset>
      </div>
    </div>

    <button type="button" class="btn btn--primary btn--green preferences__submit">
      Generate a recipe
    </button>
  </main>
</div>
