<div class="page">
  <app-header />

  <main class="generator">
    <h1 class="generator__title">Generate recipe</h1>

    <div class="generator__body">
      <p class="generator__subtitle">
        Got random stuff in your kitchen? Pop it in—we’ve got the perfect recipe waiting.
      </p>

      <div class="generator__row">
        <app-ingredient-input
          [ingredientValue]="nameValue()"
          (ingredientValueChange)="onNameInput($event)"
          [amount]="amountValue()"
          (amountChange)="amountValue.set($event)"
          [unit]="unitValue()"
          (unitChange)="unitValue.set($event)"
          [autocompleteOpen]="autocompleteOpen() && suggestions().length > 0"
          [suggestions]="suggestions()"
          [ghostText]="ghostText()"
          [highlightedSuggestion]="highlightedSuggestion()"
          [unitOpen]="unitOpen()"
          (suggestionSelected)="selectSuggestion($event)"
          (suggestionHighlighted)="onSuggestionHighlighted($event)"
          (suggestionHighlightCleared)="onSuggestionHighlightCleared()"
          (unitToggle)="onUnitToggle()"
          (nameKeydown)="onNameKeydown($event)"
          (add)="onAddIngredient()"
        />
        <app-ingredient-list
          [ingredients]="recipeRequest.ingredients()"
          [editingId]="editingId()"
          [editUnitOpen]="editUnitOpen()"
          [editAmount]="editAmount()"
          (editAmountChange)="editAmount.set($event)"
          [editUnit]="editUnit()"
          (editUnitChange)="editUnit.set($event)"
          (editStart)="onEditStart($event)"
          (editSave)="onEditSave($event)"
          (editCancel)="onEditCancel()"
          (deleteItem)="onDeleteIngredient($event)"
          (editUnitToggle)="onEditUnitToggle()"
        />
      </div>
    </div>

    @if (recipeRequest.ingredients().length > 0) {
      <a routerLink="/generator/preferences" class="btn btn--primary btn--green generator__next">
        Next step
      </a>
    }
  </main>
</div>
