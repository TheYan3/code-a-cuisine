<section class="hero">
  <div class="hero__inner">
    <app-header variant="creme" [spacious]="true" class="hero__header" />

    <div class="hero__mobile-visuals" aria-hidden="true">
      <img
        class="hero__ellipse hero__ellipse--chicken"
        src="/images/hero/ellipse-29.webp"
        alt=""
        width="295"
        height="296"
      />
      <img
        class="hero__ellipse hero__ellipse--salmon"
        src="/images/hero/ellipse-30.webp"
        alt=""
        width="429"
        height="429"
      />
      <img
        class="hero__ellipse hero__ellipse--steak"
        src="/images/hero/ellipse-31.webp"
        alt=""
        width="433"
        height="435"
      />
    </div>

    <div class="hero__plates" aria-hidden="true">
      <img
        class="hero__plate hero__plate--chicken"
        src="/images/hero/plate-chicken.webp"
        alt=""
        width="480"
        height="430"
      />
      <img
        class="hero__plate hero__plate--salmon"
        src="/images/hero/plate-salmon.webp"
        alt=""
        width="494"
        height="492"
      />
      <img
        class="hero__plate hero__plate--steak"
        src="/images/hero/plate-steak.webp"
        alt=""
        width="493"
        height="453"
      />
    </div>

    <!--
      Figma "widescreen-design" > "Visuals": five dishes, only shown once
      there's room for the wider cascade without crowding the text column
      (see `widescreen-up` in _mixins.scss). Reuses ellipse-29/30/31 (already
      loaded above for the mobile visuals, so no extra request) but adds two
      dishes — ellipse-32/33 — that exist nowhere else on the page. Those two
      go through `<picture>` with a matching `media` on the `<source>`
      instead of a plain `src`: a plain `<img>` downloads regardless of
      `display: none`, and at 150+ KB each that's real weight for the very
      few visitors below the widescreen threshold. The empty-SVG fallback
      never triggers a request (`widescreen-up` is min-width AND min-height,
      the same condition `<picture>` alone can't express, so the wrapper
      below still carries the `display: none` gate; `<picture>` only stops
      the download).
    -->
    <div class="hero__widescreen-visuals" aria-hidden="true">
      <img
        class="hero__wide-plate hero__wide-plate--chicken"
        src="/images/hero/ellipse-29.webp"
        alt=""
        width="470"
        height="470"
      />
      <img
        class="hero__wide-plate hero__wide-plate--salmon"
        src="/images/hero/ellipse-30.webp"
        alt=""
        width="484"
        height="484"
      />
      <img
        class="hero__wide-plate hero__wide-plate--steak"
        src="/images/hero/ellipse-31.webp"
        alt=""
        width="618"
        height="633"
      />
      <picture>
        <source
          media="(min-width: 1920px) and (min-height: 1300px)"
          srcset="/images/hero/ellipse-32.webp"
        />
        <img
          class="hero__wide-plate hero__wide-plate--chicken-bowl"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"
          alt=""
          width="543"
          height="543"
        />
      </picture>
      <picture>
        <source
          media="(min-width: 1920px) and (min-height: 1300px)"
          srcset="/images/hero/ellipse-33.webp"
        />
        <img
          class="hero__wide-plate hero__wide-plate--salmon-potatoes"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"
          alt=""
          width="480"
          height="480"
        />
      </picture>
    </div>

    <div class="hero__main-cta">
      <div class="hero__text">
        <p class="hero__eyebrow">AI-Powered recipe generator</p>
        <h1 class="hero__title">Code à Cuisine</h1>
      </div>
      <a routerLink="/generator" class="btn btn--primary btn--creme">Get started</a>
    </div>

    <div class="hero__secondary-cta">
      <p class="hero__secondary-text">Hungry for inspiration?</p>
      <a routerLink="/library" class="btn btn--secondary btn--creme">
        Go to cookbook
        <svg
          class="btn__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M1 12h22" />
          <path d="M17 6l6 6-6 6" />
        </svg>
      </a>
    </div>
  </div>
</section>
