<section class="hero">
  <div class="hero__inner">
    <app-header variant="creme" [spacious]="true" class="hero__header" />

    <!--
      Each dish sits in its own untransformed wrapper that carries the drop
      shadow (where one is needed, see home.scss), while the rotation/flip
      lives on the img inside: a filter is applied in the element's own
      coordinate space, so on the rotated img the shadow would turn with the
      dish instead of falling in the Figma direction.
    -->
    <div class="hero__mobile-visuals" aria-hidden="true">
      <div class="hero__ellipse hero__ellipse--chicken">
        <img src="/images/hero/ellipse-29.webp" alt="" width="302" height="303" />
      </div>
      <div class="hero__ellipse hero__ellipse--salmon">
        <img src="/images/hero/ellipse-30.webp" alt="" width="310" height="310" />
      </div>
      <div class="hero__ellipse hero__ellipse--steak">
        <img src="/images/hero/ellipse-31.webp" alt="" width="319" height="320" />
      </div>
    </div>

    <!--
      Figma "Visuals" component (instance in "widescreen-design", detached
      copy in "hero"): one chain of five dishes for every desktop size. The
      hero frame (1024px tall) crops it after the third dish, the widescreen
      frame (1440px tall) after the fifth; here the viewport height does the
      cropping, and the fourth/fifth dish only switch on once a sensible part
      of them fits (see `height-up` in home.scss). Sizes are the drawn size of
      each asset as measured against both reference PNGs, not the Figma node
      boxes (ellipse-31/32 are rotated, their boxes are rotation bounds).
      ellipse-29/30/31 are the same files as the mobile visuals above, so no
      extra request. ellipse-32/33 go through `<picture>` so they're only
      downloaded when shown (a plain `<img>` downloads despite
      `display: none`); each `media` must match the SCSS gate of its dish
      (desktop-up + $breakpoint-hero-dish-4/5-height), the empty-SVG fallback
      never triggers a request.
    -->
    <div class="hero__plates" aria-hidden="true">
      <img
        class="hero__plate hero__plate--chicken"
        src="/images/hero/ellipse-29.webp"
        alt=""
        width="480"
        height="482"
      />
      <img
        class="hero__plate hero__plate--salmon"
        src="/images/hero/ellipse-30.webp"
        alt=""
        width="494"
        height="494"
      />
      <img
        class="hero__plate hero__plate--steak"
        src="/images/hero/ellipse-31.webp"
        alt=""
        width="509"
        height="511"
      />
      <picture>
        <source
          media="(min-width: 1024px) and (min-height: 1064px)"
          srcset="/images/hero/ellipse-32.webp"
        />
        <img
          class="hero__plate hero__plate--chicken-bowl"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"
          alt=""
          width="553"
          height="553"
        />
      </picture>
      <picture>
        <source
          media="(min-width: 1024px) and (min-height: 1376px)"
          srcset="/images/hero/ellipse-33.webp"
        />
        <img
          class="hero__plate hero__plate--salmon-potatoes"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"
          alt=""
          width="490"
          height="490"
        />
      </picture>
    </div>

    <div class="hero__main-cta">
      <div class="hero__text">
        <p class="hero__eyebrow">AI-Powered recipe generator</p>
        <h1 class="hero__title">Code à Cuisine</h1>
      </div>
      <a routerLink="/generator" class="btn btn--primary btn--creme">Get started</a>
    </div>

    <div class="hero__secondary-cta">
      <p class="hero__secondary-text">Hungry for inspiration?</p>
      <a routerLink="/library" class="btn btn--secondary btn--creme">
        Go to cookbook
        <svg
          class="btn__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M1 12h22" />
          <path d="M17 6l6 6-6 6" />
        </svg>
      </a>
    </div>

    <app-footer variant="creme" class="hero__legal" />
  </div>
</section>
